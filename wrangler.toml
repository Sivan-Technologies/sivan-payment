name = "sivan-staging-gateway"
main = "infra/cloudflare/cloudflare-worker-staging-multichain.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[env.production]
name = "sivan-live-gateway"
main = "infra/cloudflare/cloudflare-worker-live-FIXED.js"
routes = [
  { pattern = "api.sivantech.online/*", zone_name = "sivantech.online" }
]

[env.staging]
name = "sivan-staging-gateway"
main = "infra/cloudflare/cloudflare-worker-staging-multichain.js"
routes = [
  { pattern = "staging.sivantech.online/*", zone_name = "sivantech.online" },
  { pattern = "api-staging.sivantech.online/*", zone_name = "sivantech.online" }
]
