# ==============================================================================
# SIVAN LIVE GATEWAY — Cloudflare Worker Deploy
# Deploys cloudflare-worker-live-FIXED.js to api.sivantech.online
# Manually deploy only after rotating and configuring PROXY_SECRET.
#
# Required GitHub Secrets (Settings > Secrets > Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers:Edit permission
#   CLOUDFLARE_ACCOUNT_ID — Your Cloudflare account ID
# ==============================================================================

name: Deploy Live Gateway Worker

on:
  workflow_dispatch:
    inputs:
      proxy_secret_ready:
        description: "Confirm the exposed proxy credential was rotated and the new value configured in Cloudflare and upstream services"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sivan-live-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy-live-worker:
    if: github.ref == 'refs/heads/main' && inputs.proxy_secret_ready
    name: Deploy to api.sivantech.online
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test gateway secret handling
        run: node --test infra/cloudflare/live-worker-secret.test.mjs

      - name: Deploy Live Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
          wranglerVersion: "3.99.0"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENVIRONMENT: production
