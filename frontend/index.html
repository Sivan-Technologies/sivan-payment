    <title>Sivan</title>
    <script>
      /*
       * Set the theme BEFORE first paint.
       *
       * Doing this in a React effect instead means every dark-mode user gets a
       * white flash on load, because the effect runs after the browser has
       * already painted the light stylesheet. This is deliberately inline and
       * synchronous in <head> for that reason.
       *
       * Kept in sync with src/hooks/useTheme.ts (same key, same fallbacks).
       */
      (function () {
        try {
          var pref = localStorage.getItem('sivan.theme');
          // Must match DEFAULT_PREFERENCE in src/hooks/useTheme.ts: light is
          // the brand default; dark is opt-in.
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'light';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#07090d' : '#f4f7fb');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
