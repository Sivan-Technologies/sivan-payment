services:
  - type: web
    name: sivan-payments-api-test
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      # Real Bridge sandbox wallets, not simulated ones. ALLOW_MOCK_WALLETS was
      # set here while the wallet adapter was unfinished; it is deliberately
      # gone now, so a missing WALLET_PROVIDER fails loudly instead of quietly
      # handing out an address nobody controls.
      - key: WALLET_PROVIDER
        value: bridge
      - key: BRIDGE_WALLETS_APPROVED
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT_MAX_PER_MINUTE
        value: "120"
      - key: RATE_LIMIT_ADMIN_MAX_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_WEBHOOK_MAX_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_AUTH_START_MAX
        value: "5"
      - key: RATE_LIMIT_AUTH_VERIFY_MAX
        value: "20"
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      # Add your Vercel frontend URLs here after deploying the user frontend and Admin Hub.
      # Example: https://sivan-payments-user-test.vercel.app,https://sivan-admin-hub-test.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: USER_JWT_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_OTP_EXPIRES_MINUTES
        value: "10"
      - key: AUTH_DEV_SHOW_OTP
        value: "true"
      - key: AUTH_REQUIRE_USER
        value: "true"
      - key: EMAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Sivan <no-reply@sivan.local>"
      - key: BRIDGE_MOCK_MODE
        value: "false"
      - key: DEFAULT_OFFRAMP_PROVIDER
        value: bridge
      - key: BRIDGE_BASE_URL
        value: https://api.sandbox.bridge.xyz/v0
      - key: BRIDGE_API_KEY
        sync: false
      - key: BRIDGE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: WEBHOOK_MAX_AGE_MS
        value: "600000"
      - key: SIVAN_OFFRAMP_FEE_PERCENT
        value: "1.25"
      - key: BRIDGE_OFFRAMP_COST_PERCENT
        value: "0.5"
      - key: BRIDGE_KYC_COST_USD
        value: "2"
      - key: BRIDGE_KYB_COST_USD
        value: "10"
      - key: CUSTOMER_ACQUISITION_COST_USD
        value: "0"
      - key: ACE_PROVIDER
        value: remote
      - key: SIVAN_AI_API_URL
        value: https://test-sivan.sivantech.online/api/sivan-ai
      - key: SIVAN_AI_API_KEY
        sync: false
      - key: SIVAN_AI_TIMEOUT_MS
        value: "3500"
      - key: SIVAN_AI_FALLBACK_ENABLED
        value: "true"

      - key: NGN_PROVIDER
        value: paj
      - key: NGN_LIVE_PROVIDER_ENABLED
        value: "true"
      - key: PAJ_RAMP_ENV
        value: staging
      - key: PAJ_RAMP_BASE_URL
        value: https://api-staging.paj.cash
      - key: PAJ_RAMP_API_KEY
        sync: false
      - key: PAJ_RAMP_WEBHOOK_URL
        value: https://api.sivantech.online/api/payment/api/webhooks/paj
      - key: PAJ_RAMP_DEFAULT_CURRENCY
        value: NGN
      - key: PAJ_RAMP_DEFAULT_CHAIN
        value: SOLANA
      - key: PAJ_RAMP_USDC_MINT
        sync: false
      - key: PAJ_RAMP_USDT_MINT
        sync: false
      - key: PAJ_RAMP_BUSINESS_USDC_FEE
        value: "0"
      - key: PAJ_RAMP_REQUIRE_SIVAN_KYC
        value: "true"
      - key: PAJ_RAMP_SESSION_MODE
        value: merchant
      - key: PAJ_RAMP_MERCHANT_TOKEN
        sync: false
      - key: PAJ_RAMP_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      - key: PAJ_RAMP_DEFAULT_BANK_ID
        sync: false
      - key: PAJ_RAMP_DEFAULT_ACCOUNT_NUMBER
        sync: false
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNT_REQUESTS_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNT_PROVIDER
        value: bridge
      - key: BRIDGE_VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_CURRENCY
        value: usdc
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_PAYMENT_RAIL
        value: base
      - key: BRIDGE_VIRTUAL_ACCOUNT_BRIDGE_WALLET_ID
        sync: false

  - type: web
    name: sivan-payments-api-live
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT_MAX_PER_MINUTE
        value: "120"
      - key: RATE_LIMIT_ADMIN_MAX_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_WEBHOOK_MAX_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_AUTH_START_MAX
        value: "5"
      - key: RATE_LIMIT_AUTH_VERIFY_MAX
        value: "20"
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      # Add your Vercel frontend URLs here after deploying the user frontend and Admin Hub.
      # Example: https://app.sivantech.online,https://admin.sivantech.online
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: USER_JWT_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_OTP_EXPIRES_MINUTES
        value: "10"
      - key: AUTH_DEV_SHOW_OTP
        value: "false"
      - key: AUTH_REQUIRE_USER
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # No mock providers in production, ever. The off-ramp registry refuses a
      # mock regardless of this flag when APP_ENV=production, but it is stated
      # here so the intent is visible in config rather than only in code.
      - key: BRIDGE_MOCK_MODE
        value: "false"
      # Real Bridge custodial wallets. Without this the registry defaults to
      # the mock adapter, whose addresses belong to nobody; in production the
      # guard then throws rather than serving a fake address.
      - key: WALLET_PROVIDER
        value: bridge
      # Bridge require Legal & Compliance sign-off on the wallet fund flow
      # before production use. Set only because that approval is in place.
      - key: BRIDGE_WALLETS_APPROVED
        value: "true"
      # Was unset, and env.ts defaults VIRTUAL_ACCOUNT_PROVIDER to mock. A
      # production virtual account must be issued by Bridge, not fabricated.
      - key: VIRTUAL_ACCOUNT_PROVIDER
        value: bridge
      - key: BRIDGE_VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: DEFAULT_OFFRAMP_PROVIDER
        value: bridge
      - key: BRIDGE_BASE_URL
        value: https://api.bridge.xyz/v0
      - key: BRIDGE_API_KEY
        sync: false
      - key: BRIDGE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: WEBHOOK_MAX_AGE_MS
        value: "600000"
      - key: SIVAN_OFFRAMP_FEE_PERCENT
        value: "1.25"
      - key: BRIDGE_OFFRAMP_COST_PERCENT
        value: "0.5"
      - key: BRIDGE_KYC_COST_USD
        value: "2"
      - key: BRIDGE_KYB_COST_USD
        value: "10"
      - key: CUSTOMER_ACQUISITION_COST_USD
        value: "0"
      - key: ACE_PROVIDER
        value: remote
      - key: SIVAN_AI_API_URL
        value: https://api.sivantech.online/api/sivan-ai
      - key: SIVAN_AI_API_KEY
        sync: false
      - key: SIVAN_AI_TIMEOUT_MS
        value: "3500"
      - key: SIVAN_AI_FALLBACK_ENABLED
        value: "true"

      - key: NGN_PROVIDER
        value: paj
      - key: NGN_LIVE_PROVIDER_ENABLED
        value: "true"
      - key: PAJ_RAMP_ENV
        value: production
      - key: PAJ_RAMP_BASE_URL
        value: https://api.paj.cash
      - key: PAJ_RAMP_API_KEY
        sync: false
      - key: PAJ_RAMP_WEBHOOK_URL
        value: https://api.sivantech.online/api/payment/api/webhooks/paj
      - key: PAJ_RAMP_DEFAULT_CURRENCY
        value: NGN
      - key: PAJ_RAMP_DEFAULT_CHAIN
        value: SOLANA
      - key: PAJ_RAMP_USDC_MINT
        sync: false
      - key: PAJ_RAMP_USDT_MINT
        sync: false
      - key: PAJ_RAMP_BUSINESS_USDC_FEE
        value: "0"
      - key: PAJ_RAMP_REQUIRE_SIVAN_KYC
        value: "true"
      - key: PAJ_RAMP_SESSION_MODE
        value: merchant
      - key: PAJ_RAMP_MERCHANT_TOKEN
        sync: false
      - key: PAJ_RAMP_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      - key: PAJ_RAMP_DEFAULT_BANK_ID
        sync: false
      - key: PAJ_RAMP_DEFAULT_ACCOUNT_NUMBER
        sync: false
