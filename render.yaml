services:
  # ---------------------------------------------------------------------------
  # USER FRONTEND
  #
  # Deployed on Render alongside the API rather than Vercel, so there is one
  # platform to operate, one place to read logs, and no second vendor to keep
  # in sync. vercel.json is kept for anyone who prefers that route.
  #
  # A static site, not a web service: Vite emits plain files and there is no
  # server to run. That also means no cold start, which matters because the
  # API on the free tier already takes ~40s to wake and a slow shell on top of
  # that would be unusable.
  # ---------------------------------------------------------------------------
  - type: web
    name: sivan-payments-user-test
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # The app routes client-side with history.pushState across /dashboard,
    # /withdraw, /verification and others. Without this rewrite those paths
    # 404 on a hard refresh or a shared link - the page only works if the user
    # arrives at / first and clicks, which is not how anyone uses a link.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # A payments app has no business being embedded, and the JWT lives in
      # localStorage where a framing attack could reach it.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sivan-payments-api-test-x9xq.onrender.com
      - key: VITE_APP_ENV
        value: test
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: sivan-payments-user-live
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Matches the live API, which is also manual. A frontend that auto-deploys
    # against a hand-deployed API drifts the moment they disagree.
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sivan-payments-api-live-cgqi.onrender.com
      - key: VITE_APP_ENV
        value: live
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: sivan-payments-api-test
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      # WHICH CHAIN THIS DEPLOYMENT SIGNS AGAINST. Read by resolveNetworkMode()
      # and reported to the UI as a read-only banner; it is NOT a user setting.
      #
      # This used to be inferred from APP_ENV === 'production', which meant the
      # chain was a side effect of a variable set for a dozen unrelated reasons
      # and there was no way to run a staging box against mainnet. Stated
      # explicitly so the chain is visible in config rather than only in code.
      #
      # 'testnet' matches what the old APP_ENV=staging fallback already
      # resolved to, so this pins current behaviour rather than changing it,
      # and it agrees with the sandbox Bridge and development Breet below.
      - key: NETWORK_MODE
        value: testnet
      # Real Bridge sandbox wallets, not simulated ones. ALLOW_MOCK_WALLETS was
      # set here while the wallet adapter was unfinished; it is deliberately
      # gone now, so a missing WALLET_PROVIDER fails loudly instead of quietly
      # handing out an address nobody controls.
      #
      # sync:false, NOT a hardcoded value. A literal here is re-applied on
      # every blueprint sync, so it silently reverts whatever an operator set
      # in the dashboard - which is exactly what happened: WALLET_PROVIDER was
      # changed to privy, verified reading 'privy', and was back to 'bridge'
      # after the next deploy with no error anywhere.
      #
      # This is only the FALLBACK now. The live choice is the admin control at
      # PUT /api/admin/wallets/controls, which is stored in the database and
      # survives deploys.
      - key: WALLET_PROVIDER
        sync: false
      - key: BRIDGE_WALLETS_APPROVED
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_ADMIN_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_WEBHOOK_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_AUTH_START_MAX
        value: "30"
      - key: RATE_LIMIT_AUTH_VERIFY_MAX
        value: "60"
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      # MUST list the frontend origin or every browser request fails, and it
      # fails in a way that looks like the API is down rather than
      # misconfigured - the request never arrives, so there is nothing in the
      # API logs to find.
      #
      # Comma-separated, no trailing slash, scheme included. Render assigns
      # onrender.com subdomains from the service names above; update these if a
      # custom domain is added.
      #
      # NOT '*': the browser sends the user's JWT on these requests.
      # BOTH deployments are live: Vercel (from frontend/vercel.json, which
      # predates the Render static site) and Render. The Vercel one was
      # silently blocked - every API call failed CORS while the page itself
      # loaded fine, which reads as "the backend is broken" rather than "this
      # origin is not allowed".
      #
      # Listing both until one is retired. Pick one before launch: two
      # frontends against one API means a fix deployed to one is invisible on
      # the other, and users will be on whichever link they were sent.
      - key: CORS_ORIGIN
        value: https://sivan-payments-user-test.onrender.com,https://sivan-payments-user-test.vercel.app,http://localhost:5173
      - key: ADMIN_API_KEY
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: USER_JWT_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_OTP_EXPIRES_MINUTES
        value: "10"
      - key: AUTH_DEV_SHOW_OTP
        value: "true"
      - key: AUTH_REQUIRE_USER
        value: "true"
      - key: EMAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Sivan <no-reply@sivan.local>"
      - key: BRIDGE_MOCK_MODE
        value: "false"
      - key: DEFAULT_OFFRAMP_PROVIDER
        value: bridge
      - key: BRIDGE_BASE_URL
        value: https://api.sandbox.bridge.xyz/v0
      - key: BRIDGE_API_KEY
        sync: false
      - key: BRIDGE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: WEBHOOK_MAX_AGE_MS
        value: "600000"
      - key: SIVAN_OFFRAMP_FEE_PERCENT
        value: "1.25"
      - key: BRIDGE_OFFRAMP_COST_PERCENT
        value: "0.5"
      - key: BRIDGE_KYC_COST_USD
        value: "2"
      - key: BRIDGE_KYB_COST_USD
        value: "10"
      - key: CUSTOMER_ACQUISITION_COST_USD
        value: "0"
      - key: ACE_PROVIDER
        value: remote
      - key: SIVAN_AI_API_URL
        value: https://test-sivan.sivantech.online/api/sivan-ai
      - key: SIVAN_AI_API_KEY
        sync: false
      - key: SIVAN_AI_TIMEOUT_MS
        value: "3500"
      - key: SIVAN_AI_FALLBACK_ENABLED
        value: "true"

      - key: KYC_LEVEL_PROVIDER
        value: mock
      - key: MONNIFY_BASE_URL
        value: https://api.monnify.com
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false

      - key: KYC_LEVEL_PROVIDER
        value: mock
      - key: MONNIFY_BASE_URL
        value: https://api.monnify.com
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false

      # sync:false, not a literal. Same trap as WALLET_PROVIDER: a hardcoded
      # value is re-applied on every blueprint sync and silently overwrites
      # the dashboard, so switching paj -> breet would revert on the next
      # deploy with no error to notice.
      - key: NGN_PROVIDER
        sync: false
      - key: NGN_LIVE_PROVIDER_ENABLED
        value: "true"
      - key: PAJ_RAMP_ENV
        value: staging
      - key: PAJ_RAMP_BASE_URL
        value: https://api-staging.paj.cash
      - key: PAJ_RAMP_API_KEY
        sync: false
      - key: PAJ_RAMP_WEBHOOK_URL
        value: https://api.sivantech.online/api/payment/api/webhooks/paj
      - key: PAJ_RAMP_DEFAULT_CURRENCY
        value: NGN
      - key: PAJ_RAMP_DEFAULT_CHAIN
        value: SOLANA
      - key: PAJ_RAMP_USDC_MINT
        sync: false
      - key: PAJ_RAMP_USDT_MINT
        sync: false
      - key: PAJ_RAMP_BUSINESS_USDC_FEE
        value: "0"
      - key: PAJ_RAMP_REQUIRE_SIVAN_KYC
        value: "true"
      - key: PAJ_RAMP_SESSION_MODE
        value: merchant
      - key: PAJ_RAMP_MERCHANT_TOKEN
        sync: false
      - key: PAJ_RAMP_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      - key: PAJ_RAMP_DEFAULT_BANK_ID
        sync: false
      - key: PAJ_RAMP_DEFAULT_ACCOUNT_NUMBER
        sync: false
      # ---- Breet, the NGN rail ----
      # Credentials are sync:false so the sandbox keys stay out of git and are
      # pasted into the Render dashboard, matching how PAJ_RAMP_API_KEY is held.
      #
      # NGN_PROVIDER is sync:false and set in the dashboard.
      #
      # IT MUST BE `breet` ON TEST. It was `paj`, which broke the bank picker
      # outright: PajRamp's resolver needs a per-user session token and the
      # staging key was never provisioned, so /api/ngn/bank-account/resolve
      # returned 500 for every account number. Verified on the deployed API -
      # the picker listed 687 PajRamp banks and none of them could resolve.
      #
      # The earlier note here said Breet had never processed a real webhook.
      # That is now stale: test:breet-e2e drives the full pipeline including
      # settlement, and the flagged path is covered too. Breet is the rail.
      - key: BREET_APP_ID
        sync: false
      - key: BREET_APP_SECRET
        sync: false
      - key: BREET_WEBHOOK_SECRET
        sync: false
      - key: BREET_MERCHANT_REFERENCE
        sync: false
      - key: BREET_ENV
        value: development
      # TEST RIG ONLY, and refused at boot in production/staging.
      #
      # Breet's sandbox resolves ANY ten digits to a plausible name, so a name
      # match there proves nothing and correctly does not grant Level 1. The
      # side effect was that the auto-approve path could not be exercised or
      # demonstrated anywhere except live - 38 perfect matches sat queued on
      # api-test for review that had nothing to review.
      - key: NGN_TRUST_SANDBOX_BANK_RESOLUTION
        value: "true"
      # Blank on purpose. Breet's asset ids are Mongo ObjectIds, not the
      # SOL_USDC_JKVK-style identifiers in their docs, and they differ between
      # environments. The adapter resolves them at runtime from
      # GET /trades/assets and caches; pinning a stale id here would send funds
      # against the wrong asset.
      - key: BREET_DEFAULT_ASSET_ID
        value: ""
      # Sivan's own vocabulary, not Breet's. The adapter maps solana -> SOL.
      - key: BREET_DEFAULT_NETWORK
        value: solana
      # Breet's platform fee. Their API returns a TIERED array rather than a
      # scalar, all three tiers currently 0.5%; this is the fallback used when
      # the live tiers cannot be read.
      - key: BREET_FEE_PERCENT
        value: "0.5"
      - key: BREET_DEFAULT_BANK_ID
        sync: false
      - key: BREET_DEFAULT_ACCOUNT_NUMBER
        sync: false
      - key: BREET_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      # ---- Sivan's margin on the NGN rail ----
      # Separate from the provider fee on purpose. The user pays 1.5% total:
      # 0.5% is Breet's cost, 1.0% is Sivan's revenue. Left at 0 the rail runs
      # at cost, which is what it did before these existed.
      - key: SIVAN_NGN_ONRAMP_FEE_PERCENT
        value: "1.0"
      - key: SIVAN_NGN_OFFRAMP_FEE_PERCENT
        value: "1.0"
      - key: SIVAN_NGN_MINIMUM_FEE_NGN
        value: "0"
      # ---- Privy embedded wallets ----
      # Present so the adapter can authenticate, but WALLET_PROVIDER above is
      # still 'bridge'. Privy wallets are user-owned: Sivan cannot sign for
      # them, verified live (signing returns 401 "No valid authorization keys
      # or user signing keys available"). Switching the wallet provider changes
      # who custodies user funds and is not done implicitly here.
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      # Delegated signer. Its PRESENCE is what turns on one-tap off-ramp: with
      # it the backend moves USDC out of a user-owned wallet as an ADDITIONAL
      # SIGNER; without it createTransfer returns pending_user_signature and
      # the user must sign. Absent by default, so the safe behaviour is the
      # default. P-256 PKCS#8 PEM - generate with generateAuthorizationKeyPair.
      - key: PRIVY_AUTHORIZATION_PRIVATE_KEY
        sync: false
      # The key quorum holding that public key. Attached to wallets AT
      # CREATION - a wallet made without it can never be delegated to, because
      # adding a signer later needs the owner's signature, which Sivan lacks.
      - key: PRIVY_AUTHORIZATION_KEY_QUORUM_ID
        sync: false
      # Solana RPC. NOT a redundancy layer over Privy - a component Privy does
      # not provide. Privy signs and broadcasts; it does not read chain state,
      # and whether a recipient already holds an SPL token account decides
      # whether a transfer works at all. Alchemy or similar as primary.
      - key: SOLANA_RPC_URL
        sync: false
      # A SECOND provider, ideally a different vendor. Only transport failures
      # fail over - a chain answer like "account not found" is returned, not
      # retried. Without either, the code falls back to the public endpoint,
      # which is rate-limited and explicitly not for production.
      - key: SOLANA_RPC_FALLBACK_URL
        sync: false
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNT_REQUESTS_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNT_PROVIDER
        value: bridge
      - key: BRIDGE_VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_CURRENCY
        value: usdc
      # Solana: the chain the product runs on and the one every Nigerian
      # off-ramp already quotes. Was base.
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_PAYMENT_RAIL
        value: solana
      # Bridge FIXES this at virtual-account creation and will not apply a
      # later change to deposits already received, so a wrong value here is
      # permanent revenue loss on that account. Provisioning refuses below
      # 1.25% rather than locking in a fee that earns nothing.
      - key: BRIDGE_VIRTUAL_ACCOUNT_DEVELOPER_FEE_PERCENT
        value: "1.25"
      # Minimum USD before a settlement is swept Bridge -> Privy. Applies to
      # THAT hand-off only, never to user-requested transfers. Sized against
      # the ~$0.31 first-time SPL token-account rent.
      - key: BRIDGE_TO_PRIVY_MIN_SWEEP_USD
        value: "6"
      - key: BRIDGE_VIRTUAL_ACCOUNT_BRIDGE_WALLET_ID
        sync: false

  - type: web
    name: sivan-payments-api-live
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      # Real chains, real money. Also the default when unset, so an accidental
      # omission still signs mainnet rather than silently moving production
      # traffic onto a test chain nobody is watching.
      - key: NETWORK_MODE
        value: mainnet
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_ADMIN_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_WEBHOOK_MAX_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_AUTH_START_MAX
        value: "30"
      - key: RATE_LIMIT_AUTH_VERIFY_MAX
        value: "60"
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      # No localhost here. A developer machine must not be able to drive the
      # production API from a browser session.
      - key: CORS_ORIGIN
        # app.sivantech.online is the PRODUCTION customer domain and was
        # missing, so every browser call from it would have been blocked by
        # CORS at launch - with no server error, just a silent failure in the
        # console. CUSTOMER_APP_URL has defaulted to it since env.ts was
        # written; the allow-list never caught up.
        value: https://app.sivantech.online,https://sivan-payments-user-live.onrender.com,https://sivan-payments-user-live.vercel.app
      - key: ADMIN_API_KEY
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: USER_JWT_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_OTP_EXPIRES_MINUTES
        value: "10"
      - key: AUTH_DEV_SHOW_OTP
        value: "false"
      - key: AUTH_REQUIRE_USER
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # No mock providers in production, ever. The off-ramp registry refuses a
      # mock regardless of this flag when APP_ENV=production, but it is stated
      # here so the intent is visible in config rather than only in code.
      - key: BRIDGE_MOCK_MODE
        value: "false"
      # Real Bridge custodial wallets. Without this the registry defaults to
      # the mock adapter, whose addresses belong to nobody; in production the
      # guard then throws rather than serving a fake address.
      # sync:false for the same reason as the test service: a literal is
      # re-applied on every blueprint sync and overwrites the dashboard.
      - key: WALLET_PROVIDER
        sync: false
      # Bridge require Legal & Compliance sign-off on the wallet fund flow
      # before production use. Set only because that approval is in place.
      - key: BRIDGE_WALLETS_APPROVED
        value: "true"
      # Was unset, and env.ts defaults VIRTUAL_ACCOUNT_PROVIDER to mock. A
      # production virtual account must be issued by Bridge, not fabricated.
      - key: VIRTUAL_ACCOUNT_PROVIDER
        value: bridge
      - key: BRIDGE_VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      # ALL FOUR WERE ABSENT ON LIVE, so production silently ran on whatever
      # env.ts defaulted to. That is fine while the defaults are right and
      # invisible when they are not - and one of them fixes an unreclaimable
      # fee at account creation. Stated explicitly here so the value
      # production uses is readable in this file.
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNT_REQUESTS_ENABLED
        value: "true"
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_CURRENCY
        value: usdc
      - key: BRIDGE_VIRTUAL_ACCOUNT_DESTINATION_PAYMENT_RAIL
        value: solana
      - key: BRIDGE_VIRTUAL_ACCOUNT_DEVELOPER_FEE_PERCENT
        value: "1.25"
      - key: BRIDGE_TO_PRIVY_MIN_SWEEP_USD
        value: "6"
      - key: DEFAULT_OFFRAMP_PROVIDER
        value: bridge
      - key: BRIDGE_BASE_URL
        value: https://api.bridge.xyz/v0
      - key: BRIDGE_API_KEY
        sync: false
      - key: BRIDGE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: WEBHOOK_MAX_AGE_MS
        value: "600000"
      - key: SIVAN_OFFRAMP_FEE_PERCENT
        value: "1.25"
      - key: BRIDGE_OFFRAMP_COST_PERCENT
        value: "0.5"
      - key: BRIDGE_KYC_COST_USD
        value: "2"
      - key: BRIDGE_KYB_COST_USD
        value: "10"
      - key: CUSTOMER_ACQUISITION_COST_USD
        value: "0"
      - key: ACE_PROVIDER
        value: remote
      - key: SIVAN_AI_API_URL
        value: https://api.sivantech.online/api/sivan-ai
      - key: SIVAN_AI_API_KEY
        sync: false
      - key: SIVAN_AI_TIMEOUT_MS
        value: "3500"
      - key: SIVAN_AI_FALLBACK_ENABLED
        value: "true"

      # sync:false, not a literal. Same trap as WALLET_PROVIDER: a hardcoded
      # value is re-applied on every blueprint sync and silently overwrites
      # the dashboard, so switching paj -> breet would revert on the next
      # deploy with no error to notice.
      - key: NGN_PROVIDER
        sync: false
      - key: NGN_LIVE_PROVIDER_ENABLED
        value: "true"
      - key: PAJ_RAMP_ENV
        value: production
      - key: PAJ_RAMP_BASE_URL
        value: https://api.paj.cash
      - key: PAJ_RAMP_API_KEY
        sync: false
      - key: PAJ_RAMP_WEBHOOK_URL
        value: https://api.sivantech.online/api/payment/api/webhooks/paj
      - key: PAJ_RAMP_DEFAULT_CURRENCY
        value: NGN
      - key: PAJ_RAMP_DEFAULT_CHAIN
        value: SOLANA
      - key: PAJ_RAMP_USDC_MINT
        sync: false
      - key: PAJ_RAMP_USDT_MINT
        sync: false
      - key: PAJ_RAMP_BUSINESS_USDC_FEE
        value: "0"
      - key: PAJ_RAMP_REQUIRE_SIVAN_KYC
        value: "true"
      - key: PAJ_RAMP_SESSION_MODE
        value: merchant
      - key: PAJ_RAMP_MERCHANT_TOKEN
        sync: false
      - key: PAJ_RAMP_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      - key: PAJ_RAMP_DEFAULT_BANK_ID
        sync: false
      - key: PAJ_RAMP_DEFAULT_ACCOUNT_NUMBER
        sync: false
      # ---- Breet, the NGN rail ----
      # All credentials sync:false. Nothing about Breet is a literal here: the
      # production app id, secret and webhook secret are entered in the Render
      # dashboard so they never reach git.
      #
      # NGN_PROVIDER is deliberately left as-is. Breet has processed zero real
      # webhooks and its USD float is $0; making it the production NGN rail is
      # a separate, deliberate decision.
      - key: BREET_APP_ID
        sync: false
      - key: BREET_APP_SECRET
        sync: false
      - key: BREET_WEBHOOK_SECRET
        sync: false
      - key: BREET_MERCHANT_REFERENCE
        sync: false
      # The one value that MUST differ from the test service. The credentials
      # currently held are sandbox ones; production keys have to be issued by
      # Breet before this environment can settle real naira.
      - key: BREET_ENV
        value: production
      # NEVER true here. A sandbox resolver invents a plausible person for any
      # ten digits, so honouring one would grant Level 1 to anybody. Stated
      # explicitly rather than left to the default, and app.ts refuses to start
      # if it is ever flipped.
      - key: NGN_TRUST_SANDBOX_BANK_RESOLUTION
        value: "false"
      # Resolved at runtime from GET /trades/assets. Breet's asset ids are
      # environment-specific ObjectIds, so a value pinned here would be wrong
      # in production even if it were right in sandbox.
      - key: BREET_DEFAULT_ASSET_ID
        value: ""
      - key: BREET_DEFAULT_NETWORK
        value: solana
      - key: BREET_FEE_PERCENT
        value: "0.5"
      - key: BREET_DEFAULT_BANK_ID
        sync: false
      - key: BREET_DEFAULT_ACCOUNT_NUMBER
        sync: false
      - key: BREET_DEFAULT_RECIPIENT_ADDRESS
        sync: false
      # ---- Sivan's margin on the NGN rail ----
      # User pays 1.5%: 0.5% Breet's cost, 1.0% Sivan's revenue. Applied to the
      # gross amount, and kept separate from the provider fee in the response
      # so the split stays auditable.
      - key: SIVAN_NGN_ONRAMP_FEE_PERCENT
        value: "1.0"
      - key: SIVAN_NGN_OFFRAMP_FEE_PERCENT
        value: "1.0"
      - key: SIVAN_NGN_MINIMUM_FEE_NGN
        value: "0"
      # ---- Privy embedded wallets ----
      # WALLET_PROVIDER above remains 'bridge'. These are present so the Privy
      # adapter can authenticate when it is switched on; they do not switch it
      # on. Privy wallets are user-owned and Sivan cannot sign for them, so
      # changing the provider changes the custody model and the off-ramp flow.
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      # Delegated signer. Its PRESENCE is what turns on one-tap off-ramp: with
      # it the backend moves USDC out of a user-owned wallet as an ADDITIONAL
      # SIGNER; without it createTransfer returns pending_user_signature and
      # the user must sign. Absent by default, so the safe behaviour is the
      # default. P-256 PKCS#8 PEM - generate with generateAuthorizationKeyPair.
      - key: PRIVY_AUTHORIZATION_PRIVATE_KEY
        sync: false
      # The key quorum holding that public key. Attached to wallets AT
      # CREATION - a wallet made without it can never be delegated to, because
      # adding a signer later needs the owner's signature, which Sivan lacks.
      - key: PRIVY_AUTHORIZATION_KEY_QUORUM_ID
        sync: false
      # Solana RPC. NOT a redundancy layer over Privy - a component Privy does
      # not provide. Privy signs and broadcasts; it does not read chain state,
      # and whether a recipient already holds an SPL token account decides
      # whether a transfer works at all. Alchemy or similar as primary.
      - key: SOLANA_RPC_URL
        sync: false
      # A SECOND provider, ideally a different vendor. Only transport failures
      # fail over - a chain answer like "account not found" is returned, not
      # retried. Without either, the code falls back to the public endpoint,
      # which is rate-limited and explicitly not for production.
      - key: SOLANA_RPC_FALLBACK_URL
        sync: false
