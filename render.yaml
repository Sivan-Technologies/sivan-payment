        sync: false
      - key: USER_JWT_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_OTP_EXPIRES_MINUTES
        value: "10"
      - key: AUTH_DEV_SHOW_OTP
        value: "false"
      - key: AUTH_REQUIRE_USER
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
